name: ML Pipeline CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt ruff

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Lint
        run: ruff check . --exclude retraining-orchestrator

      - name: Run unit tests
        run: python -m pytest tests/unit -q

      - name: Run end-to-end demo
        run: >
          python -m scripts.run_demo_pipeline
          --output-dir /tmp/ml-demo
          --screenshot /tmp/demo-results.png
          --drift-screenshot /tmp/drift-results.png

      - name: Validate Compose configuration
        run: docker compose config --quiet
